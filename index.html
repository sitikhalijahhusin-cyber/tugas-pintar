<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TugasKu — Senarai Tugasan</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc 45%,#ecfeff);color:#172033}.wrap{max-width:760px;margin:auto;padding:48px 20px}.hero{margin-bottom:22px}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:#e0e7ff;color:#4338ca;font-size:12px;font-weight:700;letter-spacing:.5px}.hero h1{font-size:38px;margin:14px 0 6px;letter-spacing:-1.5px}.hero p{margin:0;color:#64748b}.card{background:rgba(255,255,255,.9);border:1px solid #e2e8f0;border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(15,23,42,.09);backdrop-filter:blur(8px)}.add{display:flex;gap:10px}.add input{flex:1;border:1px solid #dbe2ea;border-radius:14px;padding:15px 16px;font-size:15px;outline:none;background:#f8fafc}.add input:focus{border-color:#818cf8;box-shadow:0 0 0 4px #e0e7ff}.add button{border:0;border-radius:14px;padding:0 21px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 18px #4f46e533}.add button:hover{transform:translateY(-1px)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{padding:14px;border-radius:16px;background:#f8fafc;border:1px solid #edf2f7}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#64748b}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.filters{display:flex;gap:7px}.filters button{border:0;background:#f1f5f9;color:#64748b;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600}.filters .active{background:#e0e7ff;color:#4338ca}.clear{border:0;background:none;color:#ef4444;cursor:pointer;font-size:13px}.task{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid #eef2f7;animation:in .2s ease}.task:last-child{border-bottom:0}.check{width:20px;height:20px;accent-color:#4f46e5;cursor:pointer;flex:none}.task span{flex:1;line-height:1.45}.done{text-decoration:line-through;color:#94a3b8}.delete{width:34px;height:34px;border:0;border-radius:10px;background:#fff1f2;color:#e11d48;cursor:pointer;font-size:17px}.empty{text-align:center;padding:38px 10px;color:#94a3b8}.empty-icon{font-size:34px;margin-bottom:8px}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:560px){.wrap{padding:30px 14px}.hero h1{font-size:31px}.add{flex-direction:column}.add button{height:48px}.summary{gap:7px}.stat{padding:12px 9px}.toolbar{align-items:flex-start;gap:10px;flex-direction:column}.filters{width:100%}.filters button{flex:1}}
</style></head>
<body><main class="wrap"><header class="hero"><span class="eyebrow">✨ PRODUKTIVITI HARIAN</span><h1>TugasKu</h1><p>Susun tugasan anda. Satu langkah pada satu masa.</p></header>
<section class="card"><form class="add" id="form"><input id="input" placeholder="Apa yang perlu dibuat hari ini?" autocomplete="off"><button>+ Tambah</button></form>
<div class="summary"><div class="stat"><strong id="total">0</strong><span>Jumlah tugasan</span></div><div class="stat"><strong id="pending">0</strong><span>Belum siap</span></div><div class="stat"><strong id="completed">0</strong><span>Sudah siap</span></div></div>
<div class="toolbar"><div class="filters"><button class="active" data-filter="all">Semua</button><button data-filter="active">Belum siap</button><button data-filter="done">Siap</button></div><button class="clear" id="clear">Padam yang siap</button></div><section id="list"></section></section></main>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]'),filter='all';const save=()=>localStorage.setItem('tasks',JSON.stringify(tasks));
function render(){const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)),list=document.getElementById('list');document.getElementById('total').textContent=tasks.length;document.getElementById('pending').textContent=tasks.filter(t=>!t.done).length;document.getElementById('completed').textContent=tasks.filter(t=>t.done).length;list.innerHTML=shown.length?shown.map(t=>`<div class="task"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><span class="${t.done?'done':''}">${escapeHtml(t.text)}</span><button class="delete" onclick="removeTask(${t.id})" aria-label="Padam">🗑</button></div>`).join(''):'<div class="empty"><div class="empty-icon">📝</div>Belum ada tugasan di sini.</div>';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toggle(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}function removeTask(id){tasks=tasks.filter(t=>t.id!==id);save();render()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const i=document.getElementById('input'),text=i.value.trim();if(!text)return;tasks.push({id:Date.now(),text,done:false});i.value='';save();render();i.focus()};document.getElementById('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();
</script></body></html>
